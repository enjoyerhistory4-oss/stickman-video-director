<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ep1 Scene 4</title><link rel="stylesheet" href="style.css"></head>
<body><svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script>
/* SCENE 4 — INT. YOUR FRONT DOOR (0:19–0:27)
   Your left hand (wrist band) slides the deadbolt: clack. Both hands drag a chair and wedge it
   under the knob. Then your hands hover in front of the door, trembling. */

const BOLT_AT = 1.6, BOLT_END = 1.85;          // deadbolt sound at 0:20.6
const DRAG_START = 3.0, DRAG_END = 4.6;        // chair drag 0:22.0–0:23.6
const THUNK = 4.7;                             // wedge thunk 0:23.7
const KNOB = [700, 1000];

function chair(p, x, y, rot) {
  // front view: back frame, seat, four legs. (x, y) = top of the backrest
  const cg = g(p, `translate(${x},${y}) rotate(${rot})`);
  const s = (d, w = 12) => stick(cg, d, w, C.rim, 0.45);
  s("M-110,0 L110,0", 14);                       // top rail
  s("M-100,0 L-110,330 M100,0 L110,330");        // back posts
  s("M-104,120 L104,120", 9);
  s("M-150,330 L150,330 L120,410 L-120,410 Z", 12); // seat (front edge lower)
  s("M-120,410 L-130,640 M120,410 L130,640 M-150,330 L-160,560 M150,330 L160,560");
  return cg;
}

SCENE({
  number: 4, title: "Lock the Door", start: 19, duration: 8,
  hud: (t) => ({ day: "DAY 1", time: "7:44 PM", status: t < BOLT_END ? "STATUS: SECURING DOOR" : "STATUS: DOOR LOCKED", statusAt: t < BOLT_END ? 0.1 : BOLT_END, statusColor: C.cream }),
  captions: [
    { at: 2.03, text: "Lock it.", key: "lock" },
    { at: 3.51, text: "Brace it.", key: "brace" },
    { at: 5.06, text: "Now you wait.", key: "wait" },
  ],
  draw(root, p, t) {
    el("rect", { x: 0, y: 0, width: W, height: 1520, fill: C.wall }, p);
    el("rect", { x: 0, y: 1520, width: W, height: 400, fill: C.floor }, p);
    glow(root, p, -60, 980, 1100, C.warm, 0.36); // lamp behind you, to the left
    // door
    el("rect", { x: 240, y: 230, width: 600, height: 1300, fill: "#000" }, p);
    const doorFill = linear(root, [[0, "#4a3220", 1], [1, "#22170f", 1]], 0, 0, 1, 0);
    el("rect", { x: 270, y: 260, width: 540, height: 1270, fill: doorFill }, p);
    el("rect", { x: 330, y: 330, width: 420, height: 420, fill: "none", stroke: "#000", "stroke-width": 6, opacity: 0.6 }, p);
    el("rect", { x: 330, y: 1080, width: 420, height: 380, fill: "none", stroke: "#000", "stroke-width": 6, opacity: 0.6 }, p);
    el("circle", { cx: 540, cy: 560, r: 12, fill: "#0a0a0a", stroke: "#8a6430", "stroke-width": 4 }, p); // peephole
    // knob
    el("circle", { cx: KNOB[0], cy: KNOB[1], r: 30, fill: "#c8913a", stroke: "#000", "stroke-width": 6 }, p);
    // deadbolt: plate on the door, bolt slides right into the frame
    const bk = ease(seg(t, BOLT_AT, BOLT_END));
    el("rect", { x: 650, y: 820, width: 100, height: 70, rx: 10, fill: "#b3833a", stroke: "#000", "stroke-width": 5 }, p);
    el("rect", { x: lerp(700, 760, bk), y: 840, width: 80, height: 30, fill: "#d9d4c8", stroke: "#000", "stroke-width": 4 }, p);
    el("rect", { x: 680, y: 838, width: 20, height: 34, rx: 6, fill: "#2a1f17", transform: `rotate(${lerp(0, 90, bk)} 690 855)` }, p);
    if (t > BOLT_END && t < BOLT_END + 0.35) {
      const k = seg(t, BOLT_END, BOLT_END + 0.35);
      for (const a of [-40, 0, 40]) {
        const r1 = 60 + k * 30, r2 = 90 + k * 40;
        el("line", { x1: 840 + Math.cos(rad(a)) * r1, y1: 855 + Math.sin(rad(a)) * r1, x2: 840 + Math.cos(rad(a)) * r2, y2: 855 + Math.sin(rad(a)) * r2, stroke: C.cream, "stroke-width": 6, "stroke-linecap": "round", opacity: 1 - k }, p);
      }
    }
    // chair: dragged in from the left, wedged under the knob
    const dk = ease(seg(t, DRAG_START, DRAG_END));
    const wedge = ease(seg(t, DRAG_END, THUNK));
    if (t >= DRAG_START - 0.4) {
      const bob = Math.sin(t * 28) * 6 * (dk > 0 && dk < 1 ? 1 : 0);
      const cx = lerp(-300, 640, dk), cy = lerp(1060, KNOB[1] + 34, wedge) + bob;
      const rot = lerp(-6, 16, wedge);
      chair(p, cx, cy, rot);
      if (dk > 0 && dk < 1) for (let i = 0; i < 3; i++) el("line", { x1: cx - 220 - i * 70, y1: 1700 + i * 8, x2: cx - 160 - i * 70, y2: 1700 + i * 8, stroke: C.cream, "stroke-width": 5, opacity: 0.4 }, p);
      if (t > THUNK && t < THUNK + 0.3) {
        const k = seg(t, THUNK, THUNK + 0.3);
        for (const a of [200, 250, 300, 340]) el("line", { x1: KNOB[0] + Math.cos(rad(a)) * (50 + k * 30), y1: KNOB[1] + 40 + Math.sin(rad(a)) * (50 + k * 30), x2: KNOB[0] + Math.cos(rad(a)) * (80 + k * 40), y2: KNOB[1] + 40 + Math.sin(rad(a)) * (80 + k * 40), stroke: C.cream, "stroke-width": 6, "stroke-linecap": "round", opacity: 1 - k }, p);
      }
    }
    // hands
    if (t < 2.6) {
      // left hand (band) turns the deadbolt
      const in1 = ease(seg(t, 0.3, 1.3)) * (1 - ease(seg(t, 2.0, 2.6)));
      const wx = lerp(300, 610, in1) + bk * 40, wy = lerp(2150, 960, in1);
      hand(p, { elbow: [wx - 260, wy + 900], wrist: [wx, wy], dir: -40, pose: "pinch", band: true, scale: 1.35 });
    } else if (t < DRAG_END + 0.3) {
      // both hands on the chair's top rail while dragging
      const cx = lerp(-300, 640, dk), cy = lerp(1060, KNOB[1] + 34, wedge);
      const vis = ease(seg(t, DRAG_START - 0.4, DRAG_START));
      for (const [dx, band] of [[-80, true], [80, false]]) {
        const wx = cx + dx, wy = lerp(2100, cy + 110, vis);
        hand(p, { elbow: [wx + (band ? -200 : 200), wy + 900], wrist: [wx, wy], dir: -90, pose: "grip", band, scale: 1.3 });
      }
    } else {
      // hands raised in front of the door, fingers spread, trembling
      const up = ease(seg(t, DRAG_END + 0.3, 5.4));
      for (const [x, band, dir, seed] of [[380, true, -100, 3], [720, false, -80, 7]]) {
        const [jx, jy] = jitter(t, 3.5 * up, 24, seed);
        const wy = lerp(2100, 1500, up) + jy;
        hand(p, { elbow: [x + (band ? -240 : 240), wy + 800], wrist: [x + jx, wy], dir, pose: "open", band, scale: 1.45 });
      }
    }
    vignette(root, p, 0.82);
  },
});
</script></body></html>
